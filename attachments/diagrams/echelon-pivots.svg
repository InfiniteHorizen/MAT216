<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="monospace" font-size="15">
<text x="20" y="24" font-family="sans-serif" font-size="14" fill="#888" font-weight="bold">No free variable: unique solution</text>
<text x="20" y="64">x + y + z = 1</text>
<text x="20" y="98">   2y + 3z = 2</text>
<text x="20" y="132">       4z = 8</text>
<circle cx="25" cy="59" r="13" fill="none" stroke="#2f6fdb" stroke-width="2"/>
<circle cx="56" cy="93" r="15" fill="none" stroke="#2f6fdb" stroke-width="2"/>
<circle cx="92" cy="127" r="15" fill="none" stroke="#2f6fdb" stroke-width="2"/>
<text x="20" y="170" font-family="sans-serif" font-size="13" fill="#888">3 pivots (x, y, z), 0 free variables</text>
<text x="20" y="192" font-family="sans-serif" font-size="13" fill="#888">back substitution gives (1, -2, 2)</text>
<line x1="280" y1="10" x2="280" y2="215" stroke="#888" stroke-dasharray="4 4"/>
<text x="300" y="24" font-family="sans-serif" font-size="14" fill="#888" font-weight="bold">A free variable: infinitely many</text>
<text x="300" y="64">x + y + z = 1</text>
<text x="300" y="98">   2y + 3z = 2</text>
<text x="300" y="132">        0 = 0</text>
<circle cx="305" cy="59" r="13" fill="none" stroke="#2f6fdb" stroke-width="2"/>
<circle cx="336" cy="93" r="15" fill="none" stroke="#2f6fdb" stroke-width="2"/>
<rect x="378" y="77" width="15" height="22" rx="4" fill="none" stroke="#e0642a" stroke-width="2"/>
<text x="300" y="170" font-family="sans-serif" font-size="13" fill="#888">2 pivots (x, y), z is free</text>
<text x="300" y="192" font-family="sans-serif" font-size="13" fill="#888">blue circle = pivot, orange box = free variable</text>
</svg>
