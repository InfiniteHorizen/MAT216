<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="720" height="470" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Reading the solution type from echelon form</text>

  <!-- A: start -->
  <rect x="170" y="52" width="380" height="50" rx="10" fill="#eef3fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="360" y="73" text-anchor="middle" font-size="15" fill="#1f2328">Reduce the augmented matrix to echelon form</text>
  <text x="360" y="92" text-anchor="middle" font-size="13" fill="#57606a">(row operations only)</text>

  <!-- B: degenerate row? -->
  <rect x="190" y="130" width="340" height="60" rx="10" fill="#fff8e1" stroke="#b58900" stroke-width="2"/>
  <text x="360" y="156" text-anchor="middle" font-size="15" fill="#1f2328">Is there a row  0 = b  with  b ≠ 0 ?</text>
  <text x="360" y="176" text-anchor="middle" font-size="13" fill="#57606a">(all-zero left side, non-zero constant)</text>
  <line x1="360" y1="102" x2="360" y2="130" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- yes -> no solution -->
  <path d="M190 160 H110 V250" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">yes</text>
  <rect x="20" y="250" width="180" height="76" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#8f1d14">No solution</text>
  <text x="110" y="300" text-anchor="middle" font-size="13" fill="#1f2328">inconsistent system</text>
  <text x="110" y="316" text-anchor="middle" font-size="13" fill="#1f2328">write a conclusion</text>

  <!-- no -> count pivots -->
  <line x1="360" y1="190" x2="360" y2="234" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="216" font-size="14" font-weight="bold" fill="#2e7d32">no</text>
  <rect x="230" y="234" width="260" height="52" rx="10" fill="#fff8e1" stroke="#b58900" stroke-width="2"/>
  <text x="360" y="257" text-anchor="middle" font-size="15" fill="#1f2328">Compare pivot variables</text>
  <text x="360" y="275" text-anchor="middle" font-size="15" fill="#1f2328">with number of variables</text>

  <!-- branches -->
  <path d="M360 286 V312 H280 V350" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 286 V312 H540 V350" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="305" text-anchor="middle" font-size="13" fill="#57606a">equal</text>
  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#57606a">fewer pivots</text>

  <!-- unique -->
  <rect x="170" y="350" width="220" height="86" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="280" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Unique solution</text>
  <text x="280" y="400" text-anchor="middle" font-size="13" fill="#1f2328">no free variable</text>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#1f2328">back substitution gives one point</text>

  <!-- infinite -->
  <rect x="420" y="350" width="240" height="86" rx="10" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="540" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#123c8c">Infinitely many solutions</text>
  <text x="540" y="400" text-anchor="middle" font-size="13" fill="#1f2328">free variables exist</text>
  <text x="540" y="418" text-anchor="middle" font-size="13" fill="#1f2328">let each free variable = s, t, …</text>

  <text x="360" y="458" text-anchor="middle" font-size="12" fill="#57606a">A linear system never has exactly two solutions: none, one, or infinitely many.</text>
</svg>
