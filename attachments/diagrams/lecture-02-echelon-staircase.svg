<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="350" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Echelon form: leading unknowns step to the right</text>

  <!-- column headers -->
  <g font-size="16" fill="#1f2328" text-anchor="middle" font-style="italic">
    <text x="180" y="78">x<tspan dy="4" font-size="11">1</tspan></text>
    <text x="260" y="78">x<tspan dy="4" font-size="11">2</tspan></text>
    <text x="340" y="78">x<tspan dy="4" font-size="11">3</tspan></text>
    <text x="420" y="78">x<tspan dy="4" font-size="11">4</tspan></text>
    <text x="500" y="78">x<tspan dy="4" font-size="11">5</tspan></text>
  </g>
  <text x="610" y="78" text-anchor="middle" font-size="14" fill="#57606a">constants</text>

  <!-- zero region below the staircase (grey) -->
  <g fill="#eceff1">
    <rect x="140" y="146" width="160" height="56"/>
    <rect x="140" y="202" width="240" height="56"/>
  </g>

  <!-- pivot cells -->
  <g fill="#cfe5ff" stroke="#1d6fb8" stroke-width="2">
    <rect x="140" y="90" width="80" height="56"/>
    <rect x="300" y="146" width="80" height="56"/>
    <rect x="380" y="202" width="80" height="56"/>
  </g>

  <!-- grid -->
  <g stroke="#b6bdc4" stroke-width="1" fill="none">
    <rect x="140" y="90" width="400" height="168"/>
    <line x1="140" y1="146" x2="540" y2="146"/>
    <line x1="140" y1="202" x2="540" y2="202"/>
    <line x1="220" y1="90" x2="220" y2="258"/>
    <line x1="300" y1="90" x2="300" y2="258"/>
    <line x1="380" y1="90" x2="380" y2="258"/>
    <line x1="460" y1="90" x2="460" y2="258"/>
    <rect x="570" y="90" width="80" height="168"/>
    <line x1="570" y1="146" x2="650" y2="146"/>
    <line x1="570" y1="202" x2="650" y2="202"/>
  </g>

  <!-- staircase boundary -->
  <path d="M140 146 H300 V202 H380 V258" fill="none" stroke="#d1242f" stroke-width="3" stroke-dasharray="8 5"/>

  <!-- numbers: row 1 -->
  <g font-size="20" fill="#1f2328" text-anchor="middle" dominant-baseline="central">
    <text x="180" y="118" font-weight="bold">1</text>
    <text x="260" y="118">6</text>
    <text x="340" y="118">−1</text>
    <text x="420" y="118">4</text>
    <text x="500" y="118">−2</text>
    <text x="610" y="118">7</text>
    <!-- row 2 -->
    <text x="180" y="174" fill="#6e7781">0</text>
    <text x="260" y="174" fill="#6e7781">0</text>
    <text x="340" y="174" font-weight="bold">1</text>
    <text x="420" y="174">2</text>
    <text x="500" y="174">2</text>
    <text x="610" y="174">5</text>
    <!-- row 3 -->
    <text x="180" y="230" fill="#6e7781">0</text>
    <text x="260" y="230" fill="#6e7781">0</text>
    <text x="340" y="230" fill="#6e7781">0</text>
    <text x="420" y="230" font-weight="bold">1</text>
    <text x="500" y="230">−9</text>
    <text x="610" y="230">6</text>
  </g>

  <!-- pivot / free labels -->
  <g font-size="14" text-anchor="middle">
    <text x="180" y="284" fill="#1d6fb8" font-weight="bold">pivot</text>
    <text x="260" y="284" fill="#8250df" font-weight="bold">free</text>
    <text x="340" y="284" fill="#1d6fb8" font-weight="bold">pivot</text>
    <text x="420" y="284" fill="#1d6fb8" font-weight="bold">pivot</text>
    <text x="500" y="284" fill="#8250df" font-weight="bold">free</text>
  </g>

  <!-- legend -->
  <g font-size="14" fill="#1f2328">
    <rect x="140" y="312" width="16" height="16" fill="#cfe5ff" stroke="#1d6fb8" stroke-width="2"/>
    <text x="164" y="325">leading unknown (pivot position)</text>
    <rect x="388" y="312" width="16" height="16" fill="#eceff1" stroke="#b6bdc4"/>
    <text x="412" y="325">must be 0</text>
    <line x1="500" y1="320" x2="540" y2="320" stroke="#d1242f" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="548" y="325">staircase</text>
  </g>
</svg>
